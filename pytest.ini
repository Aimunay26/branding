[pytest]
# La suite vive en pruebas/ y solo toca lo que es puro y determinista: el motor
# de puntuación, las paletas, los activos y el contenido JSON. Nada de red, nada
# de claves de API y nada que arrastre WeasyPrint (que en Windows sin GTK ni
# siquiera se puede importar).
testpaths = pruebas
python_files = test_*.py
python_classes = Prueba*
python_functions = test_*

# La raíz del proyecto en sys.path para poder hacer `from app import scoring`.
# pruebas/ no tiene __init__.py a propósito: son ficheros sueltos, no un paquete.
pythonpath = .

addopts = --strict-markers --tb=short
markers =
    pendiente: prueba escrita contra la especificación de un módulo que aún se está reescribiendo.
